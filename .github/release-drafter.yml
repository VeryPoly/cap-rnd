name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

change-template: '- $TITLE (#$NUMBER) @$AUTHOR'

template: |
  ## Changes

  $CHANGES

categories:
  - title: '🚀 Features'
    when:
      labels:
        - feature
        - enhancement

  - title: '🐛 Bug Fixes'
    when:
      labels:
        - bug
        - fix

  - title: '🧪 Tests'
    when:
      labels:
        - test
        - tests

  - title: '📚 Documentation'
    when:
      labels:
        - documentation
        - docs

  - title: '⚙️ CI/CD'
    when:
      labels:
        - ci
        - github_actions
        - dependencies

  - title: '🔧 Maintenance'
    when:
      labels:
        - chore
        - maintenance
        - refactor

  - type: version-resolver
    semver-increment: major
    when:
      labels:
        - breaking-change
  - type: version-resolver
    semver-increment: minor
    when:
      labels:
        - feature
        - enhancement
  - type: version-resolver
    semver-increment: patch
    when:
      labels:
        - bug
        - fix
        - documentation
        - docs
        - test
        - tests
        - ci
        - github_actions
        - dependencies
        - maintenance
        - refactor

change-title-escapes: '\<*_&'

version-resolver:
  default: patch

# No file-pattern rule maps to feature/enhancement - touching *.cpp/*.h
# doesn't reliably signal new-feature intent (a bug fix or refactor
# touches the same files), and that label drives a minor version bump.
# Apply feature/enhancement manually when a PR genuinely adds one.
autolabeler:
  - label: documentation
    files:
      - '*.md'

  - label: github_actions
    files:
      - '.github/**/*'

  - label: test
    files:
      - 'tests/**/*'
