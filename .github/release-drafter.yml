name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

change-template: '- $TITLE (#$NUMBER) @$AUTHOR'

template: |
  ## Changes

  $CHANGES

categories:
  - title: '🚀 Features'
    labels:
      - feature
      - enhancement

  - title: '🐛 Bug Fixes'
    labels:
      - bug
      - fix

  - title: '🧪 Tests'
    labels:
      - test
      - tests

  - title: '📚 Documentation'
    labels:
      - documentation
      - docs

  - title: '⚙️ CI/CD'
    labels:
      - ci
      - github_actions
      - dependencies

  - title: '🔧 Maintenance'
    labels:
      - chore
      - maintenance
      - refactor

change-title-escapes: '\<*_&'

version-resolver:
  major:
    labels:
      - breaking-change

  minor:
    labels:
      - feature
      - enhancement

  patch:
    labels:
      - bug
      - fix
      - documentation
      - docs
      - test
      - tests
      - ci
      - github_actions
      - dependencies
      - maintenance
      - refactor

  default: patch

# No file-pattern rule maps to feature/enhancement - touching *.cpp/*.h
# doesn't reliably signal new-feature intent (a bug fix or refactor
# touches the same files), and that label drives a minor version bump.
# Apply feature/enhancement manually when a PR genuinely adds one.
autolabeler:
  - label: documentation
    files:
      - '*.md'

  - label: github_actions
    files:
      - '.github/**/*'

  - label: test
    files:
      - 'tests/**/*'
