name: Release cap-rnd

on:
  workflow_run:
    workflows:
      - Build cap-rnd
    types:
      - completed

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build.yml
          run_id: ${{ github.event.workflow_run.id }}

      - name: Package Windows
        run: |
          cp README.md LICENSE cap-rnd-win64/

          zip -r cap-rnd-win64.zip cap-rnd-win64

      - name: Package Linux
        run: |
          cp README.md LICENSE cap-rnd-linux-x64/

          tar -czf cap-rnd-linux-x64.tar.gz cap-rnd-linux-x64

      - name: Package macOS
        run: |
          cp README.md LICENSE cap-rnd-macos/

          tar -czf cap-rnd-macos.tar.gz cap-rnd-macos

      - name: Generate SHA256 checksums
        run: |
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            *.zip
            *.tar.gz
            SHA256SUMS.txt
