name: Release cap-rnd

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download Windows artifact
        uses: dawidd6/action-download-artifact@57aa996fc1713cc1579039614f4645a7f4841fd4 # v23
        with:
          workflow: build.yml
          commit: ${{ github.sha }}
          workflow_conclusion: success
          name: cap-rnd-win64
          path: cap-rnd-win64

      - name: Download Linux artifact
        uses: dawidd6/action-download-artifact@57aa996fc1713cc1579039614f4645a7f4841fd4 # v23
        with:
          workflow: build.yml
          commit: ${{ github.sha }}
          workflow_conclusion: success
          name: cap-rnd-linux-x64
          path: cap-rnd-linux-x64

      - name: Download macOS artifact
        uses: dawidd6/action-download-artifact@57aa996fc1713cc1579039614f4645a7f4841fd4 # v23
        with:
          workflow: build.yml
          commit: ${{ github.sha }}
          workflow_conclusion: success
          name: cap-rnd-macos
          path: cap-rnd-macos

      - name: Copy documentation
        run: |
          cp README.md LICENSE cap-rnd-win64/
          cp README.md LICENSE cap-rnd-linux-x64/
          cp README.md LICENSE cap-rnd-macos/

      - name: Package Windows release
        run: |
          zip -r cap-rnd-win64.zip cap-rnd-win64

      - name: Package Linux release
        run: |
          tar -czf cap-rnd-linux-x64.tar.gz cap-rnd-linux-x64

      - name: Package macOS release
        run: |
          tar -czf cap-rnd-macos.tar.gz cap-rnd-macos

      - name: Generate checksums
        run: |
          sha256sum \
            cap-rnd-win64.zip \
            cap-rnd-linux-x64.tar.gz \
            cap-rnd-macos.tar.gz \
            > checksums.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            cap-rnd-win64.zip
            cap-rnd-linux-x64.tar.gz
            cap-rnd-macos.tar.gz

      - name: Upload release assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            cap-rnd-win64.zip
            cap-rnd-linux-x64.tar.gz
            cap-rnd-macos.tar.gz
            checksums.txt
