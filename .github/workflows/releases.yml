name: Release cap-rnd

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download platform artifacts
        uses: dawidd6/action-download-artifact@eab87c9830c39eff17e5a6eadb20bfb4bc880477 # v27
        with:
          workflow: build.yml
          commit: ${{ github.sha }}
          workflow_conclusion: success
          name: '^cap-rnd-(win64|linux-x64|macos)$'
          name_is_regexp: true
          path: .
          merge_multiple: false

      - name: Copy documentation
        run: |
          cp README.md LICENSE cap-rnd-win64/
          cp README.md LICENSE cap-rnd-linux-x64/
          cp README.md LICENSE cap-rnd-macos/

      - name: Package Windows release
        run: |
          zip -r cap-rnd-win64.zip cap-rnd-win64

      - name: Package Linux release
        run: |
          tar -czf cap-rnd-linux-x64.tar.gz cap-rnd-linux-x64

      - name: Package macOS release
        run: |
          tar -czf cap-rnd-macos.tar.gz cap-rnd-macos

      - name: Generate checksums
        run: |
          sha256sum \
            cap-rnd-win64.zip \
            cap-rnd-linux-x64.tar.gz \
            cap-rnd-macos.tar.gz \
            > checksums.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            cap-rnd-win64.zip
            cap-rnd-linux-x64.tar.gz
            cap-rnd-macos.tar.gz

      - name: Upload release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            cap-rnd-win64.zip
            cap-rnd-linux-x64.tar.gz
            cap-rnd-macos.tar.gz
            checksums.txt
