name: Release cap-rnd

on:
  workflow_run:
    workflows:
      - Build cap-rnd
    types:
      - completed

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest

    steps:
      - name: Download build artifacts
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build.yml
          run_id: ${{ github.event.workflow_run.id }}

      - name: Create release archives
        run: |
          # Windows
          mkdir cap-rnd-win64
          cp cap-rnd-win64/rnd.exe cap-rnd-win64/
          cp README.md LICENSE cap-rnd-win64/ || true

          zip -r cap-rnd-win64.zip cap-rnd-win64

          # Linux
          mkdir cap-rnd-linux-x64
          cp cap-rnd-linux-x64/rnd cap-rnd-linux-x64/
          cp README.md LICENSE cap-rnd-linux-x64/ || true

          tar -czf cap-rnd-linux-x64.tar.gz cap-rnd-linux-x64

          # macOS
          mkdir cap-rnd-macos
          cp cap-rnd-macos/rnd cap-rnd-macos/
          cp README.md LICENSE cap-rnd-macos/ || true

          tar -czf cap-rnd-macos.tar.gz cap-rnd-macos

      - name: Generate SHA256 checksums
        run: |
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.workflow_run.head_branch }}
          generate_release_notes: true
          files: |
            *.zip
            *.tar.gz
            SHA256SUMS.txt
