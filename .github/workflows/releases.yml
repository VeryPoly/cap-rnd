name: Release cap-rnd

on:
  workflow_run:
    workflows:
      - Build cap-rnd
    types:
      - completed

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event != 'pull_request'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build.yml
          run_id: ${{ github.event.workflow_run.id }}
          name: cap-rnd-win64
          path: cap-rnd-win64

      - name: Download Linux artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build.yml
          run_id: ${{ github.event.workflow_run.id }}
          name: cap-rnd-linux-x64
          path: cap-rnd-linux-x64

      - name: Download macOS artifact
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: build.yml
          run_id: ${{ github.event.workflow_run.id }}
          name: cap-rnd-macos
          path: cap-rnd-macos

      - name: Copy documentation
        run: |
          cp README.md LICENSE cap-rnd-win64/
          cp README.md LICENSE cap-rnd-linux-x64/
          cp README.md LICENSE cap-rnd-macos/

      - name: Package Windows release
        run: |
          zip -r cap-rnd-win64.zip cap-rnd-win64

      - name: Package Linux release
        run: |
          tar -czf cap-rnd-linux-x64.tar.gz cap-rnd-linux-x64

      - name: Package macOS release
        run: |
          tar -czf cap-rnd-macos.tar.gz cap-rnd-macos

      - name: Generate checksums
        run: |
          sha256sum \
            cap-rnd-win64.zip \
            cap-rnd-linux-x64.tar.gz \
            cap-rnd-macos.tar.gz \
            > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            cap-rnd-win64.zip
            cap-rnd-linux-x64.tar.gz
            cap-rnd-macos.tar.gz
            SHA256SUMS.txt