name: Release cap-rnd

on:
  workflow_run:
    workflows:
      - Build cap-rnd
    types:
      - completed

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  release:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'refs/tags/') == false

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: cap-rnd-win64
          path: artifacts/cap-rnd-win64

      - name: Download Ubuntu artifact
        uses: actions/download-artifact@v4
        with:
          name: cap-rnd-ubuntu-x64
          path: artifacts/cap-rnd-ubuntu-x64

      - name: Download Debian artifact
        uses: actions/download-artifact@v4
        with:
          name: cap-rnd-debian-x64
          path: artifacts/cap-rnd-debian-x64

      - name: Download Fedora artifact
        uses: actions/download-artifact@v4
        with:
          name: cap-rnd-fedora-x64
          path: artifacts/cap-rnd-fedora-x64

      - name: Download Arch artifact
        uses: actions/download-artifact@v4
        with:
          name: cap-rnd-arch-x64
          path: artifacts/cap-rnd-arch-x64

      - name: Download Alpine artifact
        uses: actions/download-artifact@v4
        with:
          name: cap-rnd-alpine-x64
          path: artifacts/cap-rnd-alpine-x64

      - name: Download macOS Intel artifact
        uses: actions/download-artifact@v4
        with:
          name: cap-rnd-macos-intel
          path: artifacts/cap-rnd-macos-intel

      - name: Download macOS ARM64 artifact
        uses: actions/download-artifact@v4
        with:
          name: cap-rnd-macos-arm64
          path: artifacts/cap-rnd-macos-arm64

      - name: Prepare release directory
        run: |
          mkdir -p release

      # Windows ZIP
      - name: Package Windows
        run: |
          mkdir -p release/cap-rnd-win64

          cp artifacts/cap-rnd-win64/rnd.exe \
            release/cap-rnd-win64/

          cp README.md LICENSE \
            release/cap-rnd-win64/

          cd release

          zip -r ../cap-rnd-win64.zip cap-rnd-win64

          cd ..

      # Linux packages
      - name: Package Linux distributions
        run: |
          for distro in ubuntu debian fedora arch alpine
          do
            mkdir -p release/cap-rnd-${distro}-x64

            cp artifacts/cap-rnd-${distro}-x64/rnd \
              release/cap-rnd-${distro}-x64/

            cp README.md LICENSE \
              release/cap-rnd-${distro}-x64/

            tar -czf cap-rnd-${distro}-x64.tar.gz \
              -C release cap-rnd-${distro}-x64
          done

      # macOS Intel
      - name: Package macOS Intel
        run: |
          mkdir -p release/cap-rnd-macos-intel

          cp artifacts/cap-rnd-macos-intel/rnd \
            release/cap-rnd-macos-intel/

          cp README.md LICENSE \
            release/cap-rnd-macos-intel/

          tar -czf cap-rnd-macos-intel.tar.gz \
            -C release cap-rnd-macos-intel

      # macOS ARM64
      - name: Package macOS ARM64
        run: |
          mkdir -p release/cap-rnd-macos-arm64

          cp artifacts/cap-rnd-macos-arm64/rnd \
            release/cap-rnd-macos-arm64/

          cp README.md LICENSE \
            release/cap-rnd-macos-arm64/

          tar -czf cap-rnd-macos-arm64.tar.gz \
            -C release cap-rnd-macos-arm64

      # SHA256 hashes
      - name: Generate SHA256 checksums
        run: |
          sha256sum *.zip *.tar.gz > SHA256SUMS.txt

      # Create release
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.workflow_run.head_sha }}
          name: Release ${{ github.event.workflow_run.head_sha }}
          generate_release_notes: true
          files: |
            *.zip
            *.tar.gz
            SHA256SUMS.txt
