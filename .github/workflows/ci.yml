name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

          sudo apt-get update
          sudo apt-get install -y clang-format g++

      - name: Run pre-commit hooks
        run: |
          pre-commit run --all-files

      - name: Verify formatting
        run: |
          mapfile -t files < <(git ls-files '*.cpp' '*.h')

          if [ ${#files[@]} -gt 0 ]; then
            clang-format --dry-run --Werror "${files[@]}"
          fi

      - name: Build application and tests
        uses: ./.github/actions/build-and-test
        with:
          cxx: g++
          output: rnd
          test-output: test_runner

      - name: Run tests
        run: |
          ./test_runner

      - name: Smoke test
        run: |
          printf "0\n0\n1\nn\nn\n" | ./rnd

  sanitize:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build with sanitizers
        uses: ./.github/actions/build-and-test
        with:
          cxx: g++
          output: rnd
          test-output: test_runner
          extra-flags: -fsanitize=address,undefined -fno-omit-frame-pointer -g

      - name: Run tests under sanitizers
        run: |
          ./test_runner

      - name: Smoke test under sanitizers
        run: |
          printf "0\n0\n1\nn\nn\n" | ./rnd
