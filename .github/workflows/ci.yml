name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit clang-format==22.1.8

          sudo apt-get update
          sudo apt-get install -y g++

      - name: Run pre-commit hooks
        run: |
          pre-commit run --all-files

      - name: Verify formatting
        run: |
          mapfile -t files < <(git ls-files '*.cpp' '*.h')

          if [ ${#files[@]} -gt 0 ]; then
            clang-format --dry-run --Werror "${files[@]}"
          fi

      - name: Build application and tests
        uses: ./.github/actions/build-and-test
        with:
          cxx: g++
          output: rnd
          test-output: test_runner

      - name: Run tests
        run: |
          ./test_runner

      - name: Smoke test
        run: |
          printf "0\n0\n1\nn\nn\n" | ./rnd

  sanitize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build with sanitizers
        uses: ./.github/actions/build-and-test
        with:
          cxx: g++
          output: rnd
          test-output: test_runner
          extra-flags: -fsanitize=address,undefined -fno-omit-frame-pointer -g

      - name: Run tests under sanitizers
        run: |
          ./test_runner

      - name: Smoke test under sanitizers
        run: |
          printf "0\n0\n1\nn\nn\n" | ./rnd

  static-analysis:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cppcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck

      - name: Run cppcheck
        run: |
          cppcheck --language=c++ \
            --std=c++20 \
            --enable=warning,style,performance,portability \
            --error-exitcode=1 \
            --suppress=missingIncludeSystem \
            --suppress=shadowFunction \
            --suppress=unusedStructMember \
            rnd.h rnd.cpp rndCli.h rndCli.cpp rndMain.cpp tests/test_basic.cpp

  coverage:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install lcov
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov

      - name: Build tests with coverage instrumentation
        run: |
          g++ -std=c++20 -O0 -g --coverage tests/test_basic.cpp rndCli.cpp rnd.cpp -o test_runner

      - name: Run tests
        run: |
          ./test_runner

      - name: Generate coverage report
        run: |
          lcov --capture --directory . --output-file coverage.info
          lcov --list coverage.info
