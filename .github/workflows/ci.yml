name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit

          sudo apt-get update
          sudo apt-get install -y clang-format g++

      - name: Run pre-commit hooks
        run: |
          pre-commit run --all-files

      - name: Verify formatting
        run: |
          files=$(git ls-files '*.cpp' '*.h')

          if [ -n "$files" ]; then
            clang-format --dry-run --Werror $files
          fi

      - name: Build application
        run: |
          g++ \
            -std=c++17 \
            -O2 \
            -Wall \
            -Wextra \
            -Wpedantic \
            rndMain.cpp \
            rnd.cpp \
            -o rnd

      - name: Build tests
        run: |
          g++ \
            -std=c++17 \
            -O2 \
            -Wall \
            -Wextra \
            -Wpedantic \
            tests/test_basic.cpp \
            rnd.cpp \
            -o test_runner

      - name: Run tests
        run: |
          ./test_runner

      - name: Smoke test
        run: |
          printf "0\n0\n1\nn\nn\n" | ./rnd