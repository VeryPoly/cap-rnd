name: Build cap-rnd

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
    branches:
      - main

  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false

      matrix:
        include:
          - os: windows-latest
            artifact: cap-rnd-win64
            output: rnd.exe
            test_output: test_runner.exe
            cxx: g++

          - os: ubuntu-latest
            artifact: cap-rnd-linux-x64
            output: rnd
            test_output: test_runner
            cxx: g++

          - os: macos-latest
            artifact: cap-rnd-macos
            output: rnd
            test_output: test_runner
            cxx: clang++

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show compiler version
        run: |
          ${{ matrix.cxx }} --version

      - name: Build application
        run: >
          ${{ matrix.cxx }}
          -std=c++17
          -O2
          -Wall
          -Wextra
          -Wpedantic
          rndMain.cpp
          rnd.cpp
          -o
          ${{ matrix.output }}

      - name: Build tests
        run: >
          ${{ matrix.cxx }}
          -std=c++17
          -O2
          -Wall
          -Wextra
          -Wpedantic
          tests/test_basic.cpp
          rnd.cpp
          -o
          ${{ matrix.test_output }}

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: |
          .\${{ matrix.test_output }}

      - name: Run tests (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          ./${{ matrix.test_output }}

      - name: Verify binary exists (Windows)
        if: runner.os == 'Windows'
        run: |
          if (!(Test-Path "${{ matrix.output }}")) {
            Write-Error "Binary not found"
            exit 1
          }

      - name: Verify binary exists (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          test -f ${{ matrix.output }}

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "0`n0`n1`nn`nn" | .\${{ matrix.output }}

      - name: Smoke test (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          printf "0\n0\n1\nn\nn\n" | ./${{ matrix.output }}

      - name: Create artifact directory
        run: |
          mkdir -p ${{ matrix.artifact }}

      - name: Copy binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "${{ matrix.output }}" "${{ matrix.artifact }}/"

      - name: Copy binary (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cp ${{ matrix.output }} ${{ matrix.artifact }}/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}