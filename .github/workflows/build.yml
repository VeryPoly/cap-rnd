name: Build cap-rnd

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false

      matrix:
        include:
          # Windows
          - os: windows-latest
            artifact: cap-rnd-win64
            output: rnd.exe
            cxx: g++
            cxxflags: "-std=c++17 -O2 -Wall -Wextra -Wpedantic"

          # Linux
          - os: ubuntu-latest
            artifact: cap-rnd-linux-x64
            output: rnd
            cxx: g++
            cxxflags: "-std=c++17 -O2 -Wall -Wextra -Wpedantic"

          # macOS
          - os: macos-latest
            artifact: cap-rnd-macos
            output: rnd
            cxx: clang++
            cxxflags: "-std=c++17 -O2 -Wall -Wextra -Wpedantic"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show compiler version
        run: |
          ${{ matrix.cxx }} --version

      - name: Build
        run: >
          ${{ matrix.cxx }}
          ${{ matrix.cxxflags }}
          rndMain.cpp
          rnd.cpp
          -o ${{ matrix.output }}

      - name: Verify binary exists (Windows)
        if: runner.os == 'Windows'
        run: |
          if (!(Test-Path "${{ matrix.output }}")) {
            exit 1
          }

      - name: Verify binary exists (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          test -f ${{ matrix.output }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}
