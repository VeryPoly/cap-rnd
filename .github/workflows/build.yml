name: Build cap-rnd

on:
  push:
    branches:
      - main
    tags:
      - "v*"

  pull_request:
    branches:
      - main

  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 15

    strategy:
      fail-fast: false

      matrix:
        include:
          - os: windows-2022
            artifact: cap-rnd-win64
            output: rnd.exe
            test_output: test_runner.exe
            cxx: g++

          - os: ubuntu-24.04
            artifact: cap-rnd-linux-x64
            output: rnd
            test_output: test_runner
            cxx: g++

          - os: macos-14
            artifact: cap-rnd-macos
            output: rnd
            test_output: test_runner
            cxx: clang++

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show compiler version
        run: |
          ${{ matrix.cxx }} --version

      - name: Build application and tests
        uses: ./.github/actions/build-and-test
        with:
          cxx: ${{ matrix.cxx }}
          output: ${{ matrix.output }}
          test-output: ${{ matrix.test_output }}

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        run: |
          .\${{ matrix.test_output }}

      - name: Run tests (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          ./${{ matrix.test_output }}

      - name: Verify binary exists (Windows)
        if: runner.os == 'Windows'
        run: |
          if (!(Test-Path "${{ matrix.output }}")) {
            Write-Error "Binary not found"
            exit 1
          }

      - name: Verify binary exists (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          test -f ${{ matrix.output }}

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "0`n0`n1`nn`nn" | .\${{ matrix.output }}

      - name: Smoke test (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          printf "0\n0\n1\nn\nn\n" | ./${{ matrix.output }}

      - name: Create artifact directory
        run: |
          mkdir -p ${{ matrix.artifact }}

      - name: Copy binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item "${{ matrix.output }}" "${{ matrix.artifact }}/"

      - name: Copy binary (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cp ${{ matrix.output }} ${{ matrix.artifact }}/

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}
          retention-days: 7
