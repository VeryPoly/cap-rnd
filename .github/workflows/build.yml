name: Build cap-rnd

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      fail-fast: false

      matrix:
        include:
          # Windows
          - os: windows-latest
            artifact: cap-rnd-win64
            output: rnd.exe
            cxx: g++
            cxxflags: "-std=c++17 -O2 -Wall -Wextra -Wpedantic"

          # Linux
          - os: ubuntu-latest
            artifact: cap-rnd-linux-x64
            output: rnd
            cxx: g++
            cxxflags: "-std=c++17 -O2 -Wall -Wextra -Wpedantic"

          # macOS
          - os: macos-latest
            artifact: cap-rnd-macos
            output: rnd
            cxx: clang++
            cxxflags: "-std=c++17 -O2 -Wall -Wextra -Wpedantic"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show compiler version
        run: |
          ${{ matrix.cxx }} --version

      - name: Build
        run: |
          ${{ matrix.cxx }} \
            ${{ matrix.cxxflags }} \
            rndMain.cpp \
            rnd.cpp \
            -o ${{ matrix.output }}

      - name: Verify binary exists
        run: |
          ls -lh ${{ matrix.output }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}            cxxflags: "-std=c++17 -O2 -Wall -Wextra -Wpedantic -arch x86_64"

          # macOS Apple Silicon
          - name: macos-arm64
            os: macos-14
            output: rnd
            artifact: cap-rnd-macos-arm64
            shell: bash
            strip: true
            cxx: clang++
            cxxflags: "-std=c++17 -O2 -Wall -Wextra -Wpedantic -arch arm64"

          # Ubuntu
          - name: ubuntu-x64
            os: ubuntu-latest
            output: rnd
            artifact: cap-rnd-ubuntu-x64
            shell: bash
            strip: true
            cxx: g++
            cxxflags: "-std=c++17 -O2 -Wall -Wextra -Wpedantic"
            install_deps: |
              sudo apt-get update
              sudo apt-get install -y g++

          # Debian
          - name: debian-x64
            os: ubuntu-latest
            container: debian:stable-slim
            output: rnd
            artifact: cap-rnd-debian-x64
            shell: bash
            strip: true
            cxx: g++
            cxxflags: "-std=c++17 -O2 -Wall -Wextra -Wpedantic"
            install_deps: |
              apt-get update
              apt-get install -y g++ binutils

          # Fedora
          - name: fedora-x64
            os: ubuntu-latest
            container: fedora:latest
            output: rnd
            artifact: cap-rnd-fedora-x64
            shell: bash
            strip: true
            cxx: g++
            cxxflags: "-std=c++17 -O2 -Wall -Wextra -Wpedantic"
            install_deps: |
              dnf -y update
              dnf install -y gcc-c++ binutils

          # Arch Linux
          - name: arch-x64
            os: ubuntu-latest
            container: archlinux:latest
            output: rnd
            artifact: cap-rnd-arch-x64
            shell: bash
            strip: true
            cxx: g++
            cxxflags: "-std=c++17 -O2 -Wall -Wextra -Wpedantic"
            install_deps: |
              pacman -Sy --noconfirm gcc binutils

          # Alpine Linux
          - name: alpine-x64
            os: ubuntu-latest
            container: alpine:latest
            output: rnd
            artifact: cap-rnd-alpine-x64
            shell: sh
            strip: true
            cxx: g++
            cxxflags: "-std=c++17 -O2 -Wall -Wextra -Wpedantic"
            install_deps: |
              apk add --no-cache g++ binutils

    runs-on: ${{ matrix.os }}

    container:
      image: ${{ matrix.container || '' }}

    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Windows/MSYS2 setup
      - name: Setup MSYS2
        if: matrix.use_msys2 == true
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-binutils

      # Dependency installation for non-Windows jobs
      - name: Install dependencies
        if: matrix.use_msys2 != true
        run: ${{ matrix.install_deps }}

      - name: Build
        run: |
          set -e

          echo "Compiler:"
          ${{ matrix.cxx }} --version

          echo "Building..."

          ${{ matrix.cxx }} \
            ${{ matrix.cxxflags }} \
            rndMain.cpp \
            rnd.cpp \
            -o ${{ matrix.output }}

      - name: Strip binary
        if: matrix.strip == true
        run: |
          if command -v strip >/dev/null 2>&1; then
            strip --strip-unneeded ${{ matrix.output }} || true
          fi

      - name: Verify binary
        run: |
          ls -lh ${{ matrix.output }}

          chmod +x ${{ matrix.output }} || true

          ./${{ matrix.output }} --version || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}
          compression-level: 9
          retention-days: 30
