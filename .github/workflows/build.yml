name: Build cap-rnd

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CXX: g++
  CXXFLAGS: "-std=c++17 -O2 -Wall -Wextra -Wpedantic"

jobs:
  build:
    strategy:
      matrix:
        include:
          # Windows (MinGW)
          - os: windows-latest
            output: rnd.exe
            artifact: cap-rnd-win64
            strip: false
            install_deps: |
              choco install mingw -y --force
              echo "C:\msys64\mingw64\bin" >> $GITHUB_PATH
            container: null

          # macOS (Intel)
          - os: macos-latest
            output: rnd
            artifact: cap-rnd-macos-intel
            strip: true
            install_deps: |
              brew update
              brew install gcc
            container: null

          # macOS (Apple Silicon)
          - os: macos-latest
            output: rnd
            artifact: cap-rnd-macos-arm64
            strip: true
            install_deps: |
              brew update
              brew install gcc
            container: null

          # Ubuntu (native)
          - os: ubuntu-latest
            output: rnd
            artifact: cap-rnd-ubuntu-x64
            strip: true
            install_deps: |
              sudo apt-get update
              sudo apt-get install -y g++
            container: null

          # Debian (Docker)
          - os: ubuntu-latest
            output: rnd
            artifact: cap-rnd-debian-x64
            strip: true
            install_deps: |
              apt-get update
              apt-get install -y g++
            container: debian:latest

          # Fedora (Docker)
          - os: ubuntu-latest
            output: rnd
            artifact: cap-rnd-fedora-x64
            strip: true
            install_deps: |
              dnf install -y gcc-c++
            container: fedora:latest

          # Arch Linux (Docker)
          - os: ubuntu-latest
            output: rnd
            artifact: cap-rnd-arch-x64
            strip: true
            install_deps: |
              pacman -Syu --noconfirm gcc
            container: archlinux:latest

          # Alpine (Docker)
          - os: ubuntu-latest
            output: rnd
            artifact: cap-rnd-alpine-x64
            strip: true
            install_deps: |
              apk add --no-cache g++
            container: alpine:latest

          # Termux (ARM64, Docker)
          - os: ubuntu-latest
            output: rnd
            artifact: cap-rnd-termux-arm64
            strip: true
            install_deps: |
              pkg update -y
              pkg install -y g++ clang make
            container: termux/termux-docker:latest
            env:
              CXX: clang++  # Termux uses clang by default
              CXXFLAGS: "-std=c++17 -O2 -Wall -Wextra -Wpedantic -static"

    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: ${{ matrix.install_deps }}

      - name: Build
        shell: bash
        run: |
          ${{ matrix.env.CXX || env.CXX }} rndMain.cpp rnd.cpp ${{ matrix.env.CXXFLAGS || env.CXXFLAGS }} -o ${{ matrix.output }}
          if [ "${{ matrix.strip }}" = "true" ]; then
            strip ${{ matrix.output }}
          fi

      - name: Test executable
        shell: bash
        run: |
          chmod +x ${{ matrix.output }} || true
          ./${{ matrix.output }} --version || true  # Replace with actual test command

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}
          compression-level: 9
          retention-days: 30
